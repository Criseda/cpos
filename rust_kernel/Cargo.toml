[package]
name = "rust_kernel"
version = "0.3.0"
edition = "2021"  # Using 2021 edition for better stability

[lib]
name = "rust_kernel"
path = "lib.rs"
# rlib lets host tools (cargo-fuzz) link the kernel as a normal crate
crate-type = ["staticlib", "rlib"]

[dependencies]
spin = "0.10.0"

[profile.dev]
panic = "abort"  # Don't unwind on panic

[profile.release]
panic = "abort"
opt-level = "z"  # Optimize for size
lto = true       # Link-time optimization